program: tf_attention_gru.py          # your script
method: bayes                       # or grid / random
name: tf_gru_dropout_lizmark_GPU1
metric:
  name: val_loss
  goal: minimize
parameters:
  seqLen: 
    values: [30]
  numLayers:
    values: [1]
  embeddingDim:
    values: [256]
  nSteps:
    value: 2048
  dropout:
    distribution: uniform
    min: 0.0
    max: 1.0
  batchSize:
    values: [128]
  nEpochs:
    value: 10
  trainData:
    value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv
  testData:
    value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv
  resPath:
    value: ./results
