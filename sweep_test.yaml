program: main.py
method: grid  # Bayesian optimization for hyperparameter search
metric:
  name: val_loss
  goal: minimize
parameters:
  model_type:
    values: ['transformer']
  data_path:
    value: ['data/conceptnet_gp/conceptnet_gp_train.tsv', 'data/conceptnet_gp/conceptnet_gp_valid.tsv'] #['data/ncd_conceptnet_toy/ncd_gp_conceptnet_train.tsv', 'data/ncd_conceptnet_toy/ncd_gp_conceptnet_valid.tsv'] #['data/conceptnet_gp/conceptnet_gp_train.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv']
  #data_path:
  #  value: ['data/conceptnet_gp/conceptnet_gp_train.tsv', 'data/conceptnet_gp/conceptnet_gp_valid.tsv'] # 'data/conceptnet_gp/conceptnet_gp_valid.tsv' #['data/conceptnet_gp/conceptnet_gp_valid.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv']
  
  # Key shared hyperparameters (3-5 values for critical ones)
  batch_size:
    values: [64]  # 4 values: min, mid-low, mid-high, max
  learning_rate:
    values: [1e-3]  # 4 values: low, mid-low, mid-high, high
  target_seq_len:
    values: [128]  # 4 values: min (autoencoder), mid-low, default, high
  num_epochs:
    value: 2  # Fixed to save time; can be swept if needed

  # Transformer (with blocks)
  transformer_d_model:
    values: [1024]  # 3 values: low, mid, high
  transformer_nhead:
    values: [16]  # 3 values: low, mid, high
  transformer_num_encoder_layers:  # Key block parameter
    values: [4]  # 4 values: shallow, mid-low, mid-high, deep
  transformer_num_decoder_layers:  # Key block parameter
    values: [4]  # 4 values: shallow, mid-low, mid-high, deep
  transformer_dim_feedforward:
    value: 4096  # Less critical, broader range for flexibility
  # Less critical parameters
  transformer_activation:
    value: 'relu'  # Fixed: standard choice
  transformer_pe_mode:
    value: 'fixed'  # Fixed: typical for Transformers
  transformer_fixed_scale:
    value: 1.0  # Fixed: default
  transformer_learned_scale:
    value: 1.0  # Fixed: default    
