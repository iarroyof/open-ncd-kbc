program: tf_attention_gru.py        # your script
method: bayes                       # or grid / random
name: tf_gru_wide_santo_GPU1
metric:
  name: val_loss
  goal: minimize
parameters:
  seqLen: 
    values: [30]
  numLayers:
    values: [1, 2, 4]
  embeddingDim:
    values: [256, 512, 1024]
  nSteps:
    value: 1024
  dropout:
    distribution: uniform
    min: 0.0
    max: 1.0
  batchSize:
    values: [64]
  nEpochs:
    value: 5
  trainData:
    value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv
  testData:
    value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv
  resPath:
    value: ./results
