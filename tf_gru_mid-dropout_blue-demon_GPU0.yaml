# sweep.yaml  – minimal example
program: tf_attention_gru.py          # your script
method: grid                   # or grid / random
name: tf_gru_wide_blue-demon_GPU0
metric:
  name: val_loss
  goal: minimize
parameters:
  seqLen: 
    values: [10, 30]
  numLayers:
    values: [1]
  embeddingDim:
    values: [256]
  nSteps:
    value: 2048
  dropout:
    value: 0.5
  batchSize:
    values: [64]
  nEpochs:
    value: 10
  trainData:
    value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv
  testData:
    value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv
  resPath:
    value: ./results
