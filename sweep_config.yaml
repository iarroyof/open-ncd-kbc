# sweep_config.yaml
program: main.py
method: grid  # Bayesian optimization for hyperparameter search
metric:
  name: val_loss
  goal: minimize
parameters:
  model_type:
    values: ['transformer'] #['autoencoder', 'attention_gru', 'attention_lstm', 'transformer', 'conv_s2s']
  data_path:
    value: ['data/ncd_gp_conceptnet_toy/ncd_gp_conceptnet_train.tsv', 'data/ncd_gp_conceptnet_toy/ncd_gp_conceptnet_valid.tsv'] #['data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv'] #  
  
  # Key shared hyperparameters (3-5 values for critical ones)
  batch_size:
    values: [64] #[16, 64, 128]  # 4 values: min, mid-low, mid-high, max
  learning_rate:
    values: [1e-3]  # 4 values: low, mid-low, mid-high, high
  source_seq_len:
    values: [16] #[8, 16, 32]
  target_seq_len:
    values: [64] #[32, 64, 128]  # 4 values: min (autoencoder), mid-low, default, high
  num_epochs:
    value: 2  # Fixed to save time; can be swept if needed
  optimizer:
    value: 'adafactor'
  dropout:
    value: 0.2
  # Autoencoder
  autoencoder_d_model:
    values: [512, 1024, 2048]  # 3 values: low, mid, high (research-aligned)
  autoencoder_hidden_dim:
    values: [256, 512, 1024]  # 3 values: low, mid, high
  autoencoder_num_encoder_layers:
    values: [1, 2, 4]  # 3 values: shallow, mid, deep
  # Less critical parameters
  autoencoder_activation:
    value: 'ReLU'  # Fixed: common choice
  autoencoder_pe_mode:
    value: 'fixed'  # Fixed: standard for autoencoders
  autoencoder_use_normalization:
    value: true  # Fixed: typical
  autoencoder_norm_type:
    value: 'batch'  # Fixed: effective default

  # Attention GRU
  attention_gru_embed_size:
    values: [512]  # 3 values: updated low, mid, high (shifted from 128)
  attention_gru_hidden_size:
    values: [1024]  # 3 values: low, mid, high
  attention_gru_num_layers:
    values: [2]  # 3 values: shallow, mid, deep
  attention_gru_use_attention:
    values: [true]  # 2 values: binary toggle
  attention_gru_bidirectional_encoder:
    value: true  # Fixed: common for GRU

  # Attention LSTM
  attention_lstm_embed_size:
    values: [512] #[512, 1024, 2048]  # 3 values: updated low, mid, high (shifted from 128)
  attention_lstm_hidden_size:
    values: [512] #[256, 512, 1024]  # 3 values: low, mid, high
  attention_lstm_num_layers:
    values: [2] #[1, 2, 4]  # 3 values: shallow, mid, deep
  attention_lstm_use_attention:
    values: [true] #[true, false]  # 2 values: binary toggle
  attention_lstm_bidirectional_encoder:
    value: true  # Fixed: common for LSTM

  # Transformer (with blocks)
  transformer_d_model:
    values: [1024]  # 3 values: low, mid, high
  transformer_dim_feedforward:
    values: [2048]
  transformer_nhead:
    values: [8]  # 3 values: low, mid, high
  transformer_num_encoder_layers:  # Key block parameter
    values: [1]  # 4 values: shallow, mid-low, mid-high, deep
  transformer_num_decoder_layers:  # Key block parameter
    values: [1]  # 4 values: shallow, mid-low, mid-high, deep
  # Less critical parameters
  transformer_activation:
    value: 'relu'  # Fixed: standard choice
  transformer_pe_mode:
    value: 'fixed'  # Fixed: typical for Transformers
  transformer_fixed_scale:
    value: 1.0  # Fixed: default
  transformer_learned_scale:
    value: 1.0  # Fixed: default

  # ConvS2S
  conv_s2s_embed_dim:
    values: [512, 1024, 2048]  # 3 values: low, mid, high
  conv_s2s_hidden_dim:
    values: [256, 512, 1024]  # 3 values: low, mid, high
  conv_s2s_num_layers:
    values: [2, 4, 6]  # 3 values: shallow, mid, deep
  conv_s2s_use_attention:
    values: [true, false]  # 2 values: binary toggle
  # Less critical parameters
  conv_s2s_kernel_size:
    value: 3  # Fixed: standard from paper
