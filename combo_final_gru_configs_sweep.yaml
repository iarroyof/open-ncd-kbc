program: tf_attention_gru.py
method: grid
name: gru_preset_sweep

parameters:
  # common defaults (still overrideable by preset)
  batchSize:   {value: 64}
  nEpochs:     {value: 5}
  seqLen:      {value: 30}
  trainData:   {value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv}
  testData:    {value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv}
  holdoutData: {value: data/ncd/openie5/ncd_oie5_test.tsv}
  resPath:     {value: ./results}

  # point to your JSON file of presets:
  presets_file: {value: presets_gru.json}

  # one run per preset name:
  preset:
    values:
      - best2_do-0765_E512_S512_L1   # Best of all
      - best_do-0613_E1024_S512_L1   # Best mid drop
      - best_do-0271_E256_S1024_L1   # Best low drop
      - best_do-0834_E256_S2048_L1   # Best GRU-W
      - best_do-0084_E256_S2048_L1   # Best GRU-W low drop
      - best_do-0577_E256_S2048_L1   # Best GRU-W mid drop
