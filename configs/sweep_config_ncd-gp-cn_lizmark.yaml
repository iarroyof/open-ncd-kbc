# configs/sweep_config_lizmark.yaml
program: main.py
method: bayes
metric:
  name: val_loss
  goal: minimize
parameters:
  model_type:
    values: ['autoencoder', 'attention_gru', 'attention_lstm', 'transformer', 'conv_s2s']
  data_path:
    value: ['data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv']
  #train_data_path:
  #  values: ['data/conceptnet_gp/conceptnet_gp_train.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv']
  #valid_data_path:
  #  distribution: categorical
  #  values: 
  #    - 'data/conceptnet_gp/conceptnet_gp_valid.tsv'
  #    - 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv'
  
  batch_size:
    values: [128]  # High-memory size
  learning_rate:
    values: [1e-4, 1e-3, 1e-2]
  target_seq_len:
    values: [128]  # High-memory length
  num_epochs:
    value: 3

  autoencoder_d_model:
    values: [2048]
  autoencoder_hidden_dim:
    values: [256, 512, 1024]
  autoencoder_num_encoder_layers:
    values: [1, 2, 4]
  autoencoder_activation:
    value: 'ReLU'
  autoencoder_pe_mode:
    value: 'fixed'
  autoencoder_use_normalization:
    value: true
  autoencoder_norm_type:
    value: 'batch'

  attention_gru_embed_size:
    values: [2048]
  attention_gru_hidden_size:
    values: [256, 512, 1024]
  attention_gru_num_layers:
    values: [1, 2, 4]
  attention_gru_use_attention:
    values: [true, false]
  attention_gru_bidirectional_encoder:
    value: true

  attention_lstm_embed_size:
    values: [2048]
  attention_lstm_hidden_size:
    values: [256, 512, 1024]
  attention_lstm_num_layers:
    values: [1, 2, 4]
  attention_lstm_use_attention:
    values: [true, false]
  attention_lstm_bidirectional_encoder:
    value: true

  transformer_d_model:
    values: [1024]  # Larger size only
  transformer_nhead:
    values: [4, 8, 16]
  transformer_num_encoder_layers:
    values: [1, 2, 4]
  transformer_num_decoder_layers:
    values: [1, 2, 4]
  transformer_dim_feedforward:
    min: 1024
    max: 4096
  transformer_activation:
    value: 'relu'
  transformer_pe_mode:
    value: 'fixed'
  transformer_fixed_scale:
    value: 1.0
  transformer_learned_scale:
    value: 1.0

  conv_s2s_embed_dim:
    values: [2048]
  conv_s2s_hidden_dim:
    values: [256, 512, 1024]
  conv_s2s_num_layers:
    values: [2, 4, 6]
  conv_s2s_use_attention:
    values: [true, false]
  conv_s2s_kernel_size:
    value: 3
