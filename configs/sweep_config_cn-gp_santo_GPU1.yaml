
# configs/sweep_config_cn-gp_santo_GPU1.yaml

program: main.py
name: cn-gp_santo_GPU1
method: bayes
metric:
  name: val_loss
  goal: minimize
parameters:
  model_type:
    values: ['attention_gru', 'attention_lstm'] #, 'transformer']
  data_path:
    value: ['data/conceptnet_gp/conceptnet_gp_train.tsv', 'data/conceptnet_gp/conceptnet_gp_valid.tsv']
  # Santo is assigned a mid-range batch size
  batch_size:
    values: [64]
  learning_rate:
    values: [1e-4, 1e-3, 1e-2]
  # UPDATED: target_seq_len for Santo is set to mid-range.
  target_seq_len:
    values: [64]
  # NEW: source_seq_len; Santo gets an intermediate value.
  source_seq_len:
    values: [16]
  num_epochs:
    value: 10
  optimizer:
    value: 'adafactor'

  attention_gru_embed_size:
    values: [512, 1024]
  attention_gru_hidden_size:
    values: [256, 512, 1024]
  attention_gru_num_layers:
    values: [1, 2, 4]
  attention_gru_use_attention:
    values: [true, false]
  attention_gru_bidirectional_encoder:
    value: true

  attention_lstm_embed_size:
    values: [512, 1024]
  attention_lstm_hidden_size:
    values: [256, 512, 1024]
  attention_lstm_num_layers:
    values: [1, 2, 4]
  attention_lstm_use_attention:
    values: [true, false]
  attention_lstm_bidirectional_encoder:
    value: true

  transformer_d_model:
    values: [256, 512]
  transformer_nhead:
    values: [4, 8]
  transformer_num_encoder_layers:
    values: [1, 2]
  transformer_num_decoder_layers:
    values: [1, 2]
  transformer_dim_feedforward:
    min: 1024
    max: 2048
  transformer_activation:
    value: 'relu'
  transformer_pe_mode:
    value: 'fixed'
  transformer_fixed_scale:
    value: 1.0
  transformer_learned_scale:
    value: 1.0
