# configs/sweep_config_ncd-gp-cn_lizmark_GPU0.yaml
program: main.py
name: ncd-gp-cn_lizmark_GPU0
method: bayes
metric:
  name: val_loss
  goal: minimize
parameters:
  model_type:
    values: ['autoencoder', 'attention_gru', 'attention_lstm', 'conv_s2s', 'transformer']
  data_path:
    value: ['data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv']
  # Lizmark gets the highest batch size.
  batch_size:
    values: [128]
  learning_rate:
    values: [1e-4, 1e-3, 1e-2]
  # UPDATED: target_seq_len for Lizmark is the highest.
  target_seq_len:
    values: [128]
  # NEW: source_seq_len; Lizmark gets the highest.
  source_seq_len:
    values: [32]
  num_epochs:
    value: 10

  autoencoder_d_model:
    values: [2048]
  autoencoder_hidden_dim:
    values: [256, 512, 1024]
  autoencoder_num_encoder_layers:
    values: [1, 2, 4]
  autoencoder_activation:
    value: 'ReLU'
  autoencoder_pe_mode:
    value: 'fixed'
  autoencoder_use_normalization:
    value: true
  autoencoder_norm_type:
    value: 'batch'

  attention_gru_embed_size:
    values: [2048]
  attention_gru_hidden_size:
    values: [256, 512, 1024]
  attention_gru_num_layers:
    values: [1, 2, 4]
  attention_gru_use_attention:
    values: [true, false]
  attention_gru_bidirectional_encoder:
    value: true

  attention_lstm_embed_size:
    values: [2048]
  attention_lstm_hidden_size:
    values: [256, 512, 1024]
  attention_lstm_num_layers:
    values: [1, 2, 4]
  attention_lstm_use_attention:
    values: [true, false]
  attention_lstm_bidirectional_encoder:
    value: true

  transformer_d_model:
    values: [1024]
  transformer_nhead:
    values: [4, 8, 16]
  transformer_num_encoder_layers:
    values: [1, 2, 4]
  transformer_num_decoder_layers:
    values: [1, 2, 4]
  transformer_dim_feedforward:
    min: 1024
    max: 4096
  transformer_activation:
    value: 'relu'
  transformer_pe_mode:
    value: 'fixed'
  transformer_fixed_scale:
    value: 1.0
  transformer_learned_scale:
    value: 1.0

  conv_s2s_embed_dim:
    values: [2048]
  conv_s2s_hidden_dim:
    values: [256, 512, 1024]
  conv_s2s_num_layers:
    values: [2, 4, 6]
  conv_s2s_use_attention:
    values: [true, false]
  conv_s2s_kernel_size:
    value: 3
