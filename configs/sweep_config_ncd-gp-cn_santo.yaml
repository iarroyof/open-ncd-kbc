# sweep_config_santo.yaml

program: main.py
name: Santo
method: bayes
metric:
  name: val_loss
  goal: minimize
parameters:
  model_type:
    values: ['attention_gru', 'attention_lstm', 'transformer']
  data_path:
    value: ['data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv']
  #train_data_path:
  #  values: ['data/conceptnet_gp/conceptnet_gp_train.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv']
  #valid_data_path:
  #  distribution: categorical
  #  values: 
  #    - 'data/conceptnet_gp/conceptnet_gp_valid.tsv'
  #    - 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv'
  
  batch_size:
    values: [16, 64]  # Smaller sizes for 24 GB
  learning_rate:
    values: [1e-4, 1e-3, 1e-2]
  target_seq_len:
    values: [16, 64]  # Moderate lengths
  num_epochs:
    value: 3

  attention_gru_embed_size:
    values: [512, 1024]  # Moderate sizes
  attention_gru_hidden_size:
    values: [256, 512, 1024]
  attention_gru_num_layers:
    values: [1, 2, 4]
  attention_gru_use_attention:
    values: [true, false]
  attention_gru_bidirectional_encoder:
    value: true

  attention_lstm_embed_size:
    values: [512, 1024]  # Moderate sizes
  attention_lstm_hidden_size:
    values: [256, 512, 1024]
  attention_lstm_num_layers:
    values: [1, 2, 4]
  attention_lstm_use_attention:
    values: [true, false]
  attention_lstm_bidirectional_encoder:
    value: true

  transformer_d_model:
    values: [256, 512]  # Smaller sizes
  transformer_nhead:
    values: [4, 8]
  transformer_num_encoder_layers:
    values: [1, 2]
  transformer_num_decoder_layers:
    values: [1, 2]
  transformer_dim_feedforward:
    min: 1024
    max: 2048  # Reduced range for smaller models
  transformer_activation:
    value: 'relu'
  transformer_pe_mode:
    value: 'fixed'
  transformer_fixed_scale:
    value: 1.0
  transformer_learned_scale:
    value: 1.0
