# sweep.yaml  – minimal example
program: tf_attention_gru.py          # your script
method: bayes                       # or grid / random
name: tf_gru_wide
metric:
  name: val_loss
  goal: minimize
parameters:
  seqLen:        {values: [30]}
  numLayers:     {values: [1, 2, 4]}
  embeddingDim:  {values: [256, 512, 1024]}
  nSteps:        {values: [512, 1024, 2048]}
  dropout:       {min: 0.0, max: 1.0}
  batchSize:     {values: [64]}
  nEpochs:       {value: 1}
  trainData:       {value: data/ncd_gp_conceptnet_toy/ncd_gp_conceptnet_train.tsv}
  testData:        {value: data/ncd_gp_conceptnet_toy/ncd_gp_conceptnet_valid.tsv}
  resPath:         {value: ./results}
