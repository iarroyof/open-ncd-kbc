program: tf_attention_gru.py          # the script name
method: bayes                         # {grid, random, bayes}
metric:
  name: val_loss
  goal: minimize
parameters:
  seqLen:        {values: [40, 50, 60]}
  embeddingDim:  {values: [512, 768, 1024]}
  nSteps:        {values: [512, 768, 1024]}
  dropout:       {min: 0.0, max: 0.3}
  batchSize:     {values: [32, 64]}
  nEpochs:       {value: 30}
