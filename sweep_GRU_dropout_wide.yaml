# sweep_GRU_test.yaml
program: main.py
method: bayes  # Bayesian optimization for hyperparameter search
name: GRU_test
metric:
  name: val_loss
  goal: minimize
parameters:
  model_type:
    values: ['attention_gru'] #['autoencoder', 'attention_gru', 'attention_lstm', 'transformer', 'conv_s2s']
  data_path:
    value: ['data/ncd_gp_conceptnet_toy/ncd_gp_conceptnet_train.tsv', 'data/ncd_gp_conceptnet_toy/ncd_gp_conceptnet_valid.tsv'] #['data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv'] #  
  
  # Key shared hyperparameters (3-5 values for critical ones)
  batch_size:
    values: [16, 32, 64] #[16, 64, 128]  # 4 values: min, mid-low, mid-high, max
  #learning_rate:
  #  values: [1e-4, 1e-3, 1e-2]  # 4 values: low, mid-low, mid-high, high
  source_seq_len:
    values: [16, 32, 64] #[8, 16, 32]
  target_seq_len:
    values: [32, 64, 128]  # 4 values: min (autoencoder), mid-low, default, high
  num_epochs:
    value: 10  # Fixed to save time; can be swept if needed
  optimizer:
    value: 'adafactor'
  dropout:
    distribution: 'uniform'
    min: 0.0
    max': 0.7

  # Attention GRU
  attention_gru_embed_size:
    values: [256, 512, 1024]  # 3 values: updated low, mid, high 
  attention_gru_hidden_size:
    values: [256, 512, 1024]  # 3 values: low, mid, high
  attention_gru_num_layers:
    values: [2, 4]  # 3 values: shallow, mid, deep
  attention_gru_use_attention:
    values: [true]  # 2 values: binary toggle
  attention_gru_bidirectional_encoder:
    value: true  # Fixed: common for GRU
early_terminate:
  type: null  # Disable early termination to ensure sufficient exploration
