# sweep_GRU_dropout_wide.yaml
program: main.py
method: bayes  # Bayesian optimization for hyperparameter search
name: GRU_dropout_wide
metric:
  name: val_loss
  goal: minimize
parameters:
  model_type:
    values: ['attention_gru'] #['autoencoder', 'attention_gru', 'attention_lstm', 'transformer', 'conv_s2s']
  data_path:
    value: ['data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv', 'data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv'] 
  
  # Key shared hyperparameters (3-5 values for critical ones)
  batch_size:
    values: [32, 64, 128] # 32 in UTAH NLP for T5 https://aclanthology.org/2024.naacl-long.310.pdf; https://arxiv.org/pdf/2204.04991. luong-etal-2015 uses 128 for AttGRU
  #learning_rate:
  #  values: [1e-4, 1e-3, 1e-2]  # 4 values: low, mid-low, mid-high, high
  source_seq_len:
    values: [16, 32, 64] # luong-etal-2015 uses 50 for src AttGRU, we obtained 32 in our own task-specific sens analysis with fixed 0.1 droput (Bahdanau and Bengio used 30 and 50)
  target_seq_len:
    values: [16, 32, 64]  # luong-etal-2015 uses 50 for trg AttGRU, we obtained 64 in our own task-specific sens analysis with fixed 0.1 droput
  num_epochs:
    value: 3  # 3 in UTAH NLP for T5 in massive experiments https://aclanthology.org/2024.naacl-long.310.pdf (5 a 6.5 in Bahdanau and Bengio et.al. http://arxiv.org/abs/1409.0473) 
  optimizer:
    value: 'adafactor'
  dropout:
    distribution: 'uniform'
    min: 0.0
    max: 0.95

  # Attention GRU
  attention_gru_embed_size:
    values: [256, 512, 1024]  # we obtained 512 in our own task-specific sens analysis with fixed 0.1 droput. luong et.al. used 1000 dimensions (and also 1000 cells)
  attention_gru_hidden_size:
    values: [256, 512, 1024]  # we obtained 1024 in our own task-specific sens analysis with fixed 0.1 droput
  attention_gru_num_layers:
    values: [2, 4]  # luong et.al. used 4 layers
  attention_gru_use_attention:
    values: [true]  # 2 values: binary toggle
  attention_gru_bidirectional_encoder:
    value: true  # Fixed: common for GRU

