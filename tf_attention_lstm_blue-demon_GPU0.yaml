# sweep.yaml  – minimal example
program: tf_attention_lstm.py          # your script
method: bayes                       # or grid / random
name: tf_lstm_wide_blue-demon_GPU0
metric:
  name: val_loss
  goal: minimize
parameters:
  seqLen: 
    values: [30]
  numLayers:
    values: [1, 2]
  embeddingDim:
    values: [256, 512, 1024]
  nSteps:
    value: 2048
  dropout:
    values: [0.01, 0.5, 0.9]
  batchSize:
    values: [64]
  nEpochs:
    value: 5
  trainData:
    value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_train.tsv
  testData:
    value: data/ncd_gp_conceptnet/ncd_gp_conceptnet_valid.tsv
  resPath:
    value: ./results
